worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==============================
    # Бекенди
    # ==============================
    upstream auth_service {
        server auth_service:8000;
    }

    upstream tasks_service {
        server tasks_service:8000;
    }

    # ==============================
    # Сервер
    # ==============================
    server {
        listen 1313;

        # ------------------------------
        # Auth сервіс
        # ------------------------------
        location /auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # ------------------------------
        # WebSocket для /projects/ws
        # ------------------------------
        location /lirililarila/projects/ws/ {
            proxy_pass http://tasks_service/projects/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # ------------------------------
        # Tasks сервіс (HTTP + WebSocket)
        # ------------------------------
        location /lirililarila/ {
            proxy_pass http://tasks_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # ------------------------------
        # favicon
        # ------------------------------
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        # ------------------------------
        # Коренева сторінка
        # ------------------------------
        location / {
            return 200 "Welcome to the API Gateway\n";
        }
    }
}
