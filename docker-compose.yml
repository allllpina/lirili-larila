version: "3.9"

networks:
  backend:
    driver: bridge

services:
  nginx:
    build: ./nginx
    ports:
      - "1313:1313"
    depends_on:
      - auth_service
      - tasks_service
      - frontend
    networks:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    networks:
      - backend
    restart: unless-stopped

  auth_service:
    build: ./auth
    env_file: ./.env
    depends_on:
      - db-users
    networks:
      - backend
    restart: unless-stopped

  tasks_service:
    build: ./tasks_mservice
    env_file: ./.env
    depends_on:
      - db-tasks
    networks:
      - backend
    restart: unless-stopped

  db-users:
    build: ./db_users
    env_file: ./.env
    volumes:
      - db_users_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  db-tasks:
    image: mongo:latest
    volumes:
      - db_tasks_data:/data/db
    networks:
      - backend
    restart: unless-stopped

volumes:
  db_users_data:
  db_tasks_data:
