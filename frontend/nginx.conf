server {
    listen 80;
    
    # Де лежать збілджені файли React
    root /usr/share/nginx/html;
    index index.html;

    # Головна магія для SPA:
    # Якщо файл не знайдено (наприклад /project/5), віддаємо index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кешування статики (JS, CSS, Images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}