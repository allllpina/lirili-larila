name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    name: auth (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: auth/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Lint only for now. After a one-off `ruff format .` commit,
      # append `&& ruff format --check .` here.
      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -v

  projects:
    name: projects (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasks_mservice
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tasks_mservice/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        env:
          REQUIRE_MONGO: "1" # fail instead of skip if the Mongo container is down
        run: pytest -v

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    needs: [auth, projects]
    strategy:
      matrix:
        service: [auth, tasks_mservice]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }}
        run: docker build ./${{ matrix.service }}
